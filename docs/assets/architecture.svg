<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Local job opportunity intelligence architecture</title>
  <desc id="desc">A Windows Task Scheduler starts a local Python pipeline. Approved public APIs enter validation, qualification, deduplication and scoring. Results go to Google Sheets and local recovery storage. Optional AI is disabled by default. Applying remains a manual human action.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16335c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#57708f"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, Segoe UI, sans-serif; fill: #172b4d; }
      .subtitle { font: 400 19px Inter, Segoe UI, sans-serif; fill: #5f6f82; }
      .label { font: 700 21px Inter, Segoe UI, sans-serif; fill: #203a5f; }
      .copy { font: 400 16px Inter, Segoe UI, sans-serif; fill: #516174; }
      .eyebrow { font: 700 13px Inter, Segoe UI, sans-serif; letter-spacing: 1.6px; fill: #1a73e8; }
      .small { font: 600 14px Inter, Segoe UI, sans-serif; fill: #62748a; }
      .flow { fill: none; stroke: #57708f; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="1470" cy="70" r="190" fill="#e8f0fe"/>
  <circle cx="90" cy="870" r="210" fill="#eaf5f2"/>

  <text x="90" y="92" class="eyebrow">ZERO-BUDGET · LOCAL-FIRST · HUMAN-IN-THE-LOOP</text>
  <text x="90" y="146" class="title">Opportunity intelligence, without auto-applying</text>
  <text x="90" y="184" class="subtitle">Policy-aware discovery and transparent filtering run on the user’s Windows computer.</text>

  <path d="M300 344 H390" class="flow"/>
  <path d="M635 344 H725" class="flow"/>
  <path d="M1065 344 H1155" class="flow"/>
  <path d="M895 470 V555" class="flow"/>
  <path d="M1285 470 V555" class="flow"/>
  <path d="M1285 704 V770" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="80" y="260" width="220" height="168" rx="18" fill="#fff" stroke="#d7e0eb"/>
    <rect x="400" y="246" width="235" height="196" rx="18" fill="#fff" stroke="#d7e0eb"/>
    <rect x="735" y="230" width="330" height="240" rx="18" fill="#fff" stroke="#b8cdf0" stroke-width="2"/>
    <rect x="1165" y="246" width="240" height="196" rx="18" fill="#fff" stroke="#d7e0eb"/>
    <rect x="755" y="565" width="280" height="140" rx="18" fill="#fff" stroke="#d7e0eb"/>
    <rect x="1145" y="565" width="280" height="140" rx="18" fill="#fff" stroke="#d7e0eb"/>
    <rect x="1145" y="778" width="280" height="82" rx="18" fill="#eaf5f2" stroke="#8fc6b7"/>
  </g>

  <rect x="80" y="260" width="220" height="10" rx="5" fill="#5f6f82"/>
  <text x="110" y="310" class="eyebrow">TRIGGER</text>
  <text x="110" y="348" class="label">Windows Scheduler</text>
  <text x="110" y="380" class="copy">One daily task</text>
  <text x="110" y="407" class="copy">Overlap protection</text>

  <rect x="400" y="246" width="235" height="10" rx="5" fill="#1a73e8"/>
  <text x="430" y="296" class="eyebrow">ACQUIRE</text>
  <text x="430" y="334" class="label">Approved public APIs</text>
  <text x="430" y="368" class="copy">HTTPS host allowlists</text>
  <text x="430" y="395" class="copy">Rate and size limits</text>
  <text x="430" y="422" class="copy">No scraping fallback</text>

  <rect x="735" y="230" width="330" height="12" rx="6" fill="#1a73e8"/>
  <text x="770" y="286" class="eyebrow">LOCAL PYTHON PIPELINE</text>
  <text x="770" y="328" class="label">Deterministic decision engine</text>
  <text x="770" y="365" class="copy">Normalize and canonicalize</text>
  <text x="770" y="395" class="copy">Deduplicate with immutable IDs</text>
  <text x="770" y="425" class="copy">Qualify, score, and quarantine</text>
  <rect x="770" y="446" width="214" height="1" fill="#d7e0eb"/>

  <rect x="1165" y="246" width="240" height="10" rx="5" fill="#34a853"/>
  <text x="1195" y="296" class="eyebrow">OPERATE</text>
  <text x="1195" y="334" class="label">Google Sheets</text>
  <text x="1195" y="368" class="copy">Desktop OAuth</text>
  <text x="1195" y="395" class="copy">Conflict-safe cell writes</text>
  <text x="1195" y="422" class="copy">Human-owned workflow</text>

  <rect x="755" y="565" width="280" height="10" rx="5" fill="#f9ab00"/>
  <text x="785" y="615" class="eyebrow">OPTIONAL GATE</text>
  <text x="785" y="653" class="label">AI analysis</text>
  <text x="785" y="681" class="copy">Disabled by default · no paid fallback</text>

  <rect x="1145" y="565" width="280" height="10" rx="5" fill="#65758b"/>
  <text x="1175" y="615" class="eyebrow">RECOVER</text>
  <text x="1175" y="653" class="label">Local snapshots</text>
  <text x="1175" y="681" class="copy">Lease · pending run · replay</text>

  <text x="1180" y="812" class="eyebrow" fill="#147d64">HUMAN BOUNDARY</text>
  <text x="1180" y="842" class="label">Review and apply manually</text>

  <rect x="88" y="764" width="870" height="74" rx="14" fill="#fff4e5" stroke="#f1c277"/>
  <text x="118" y="797" class="label" fill="#7a4b00">Safety invariant</text>
  <text x="118" y="824" class="copy">No application, proposal, email, message, or authenticated job-platform action is automated.</text>
</svg>
