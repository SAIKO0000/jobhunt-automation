<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" style="max-width:100%;height:auto">
  <title id="title">Local job-hunt automation architecture</title>
  <desc id="description">A daily Windows task reads approved public feeds. Local Python normalizes, deduplicates, qualifies, and scores listings, then writes a review queue to Google Sheets. The user reviews and applies manually. Optional AI is off; local snapshots support recovery.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .heading { fill: #14283f; font-size: 50px; font-weight: 700; letter-spacing: -1.5px; }
      .subheading { fill: #53677d; font-size: 22px; }
      .number { fill: #3367d6; font-size: 17px; font-weight: 700; }
      .stage { fill: #14283f; font-size: 25px; font-weight: 700; letter-spacing: -.4px; }
      .body { fill: #4c6076; font-size: 18px; }
      .engine-number { fill: #b9d4ff; font-size: 17px; font-weight: 700; }
      .engine-stage { fill: #ffffff; font-size: 29px; font-weight: 700; letter-spacing: -.5px; }
      .engine-body { fill: #e3edff; font-size: 19px; }
      .note-title { fill: #14283f; font-size: 21px; font-weight: 700; }
      .note { fill: #4c6076; font-size: 17px; }
      .safety { fill: #15594f; font-size: 26px; font-weight: 700; }
      .safety-note { fill: #376d65; font-size: 17px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect x="80" y="70" width="58" height="6" fill="#3367d6"/>
  <text x="80" y="143" class="heading">A job search you can audit</text>
  <text x="80" y="188" class="subheading">One local run moves public listings into a review queue. Applying stays human.</text>

  <!-- One solid path. Each stage owns a fixed, measured text area. -->
  <rect x="80" y="258" width="1440" height="320" rx="16" fill="#ffffff" stroke="#cbd7e4" stroke-width="2"/>
  <path d="M328 258 V578 M594 258 V578 M1018 258 V578 M1292 258 V578" stroke="#d9e2ec" stroke-width="2"/>
  <rect x="594" y="258" width="424" height="320" fill="#244bb8"/>
  <rect x="1310" y="276" width="192" height="284" rx="12" fill="#edf7f5"/>

  <g fill="#ffffff" stroke="#cbd7e4" stroke-width="2">
    <circle cx="328" cy="418" r="19"/>
    <circle cx="594" cy="418" r="19"/>
    <circle cx="1018" cy="418" r="19"/>
    <circle cx="1292" cy="418" r="19"/>
  </g>
  <g fill="none" stroke="#3367d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M321 418 H335 M329 411 L336 418 L329 425"/>
    <path d="M587 418 H601 M595 411 L602 418 L595 425"/>
    <path d="M1011 418 H1025 M1019 411 L1026 418 L1019 425"/>
    <path d="M1285 418 H1299 M1293 411 L1300 418 L1293 425"/>
  </g>

  <text x="108" y="312" class="number">01 / Trigger</text>
  <text x="108" y="365" class="stage">Daily run</text>
  <text x="108" y="412" class="body">Windows Task</text>
  <text x="108" y="442" class="body">Scheduler</text>
  <text x="108" y="507" class="body">Once a day</text>
  <text x="108" y="537" class="body">No overlap</text>

  <text x="356" y="312" class="number">02 / Collect</text>
  <text x="356" y="365" class="stage">Approved feeds</text>
  <text x="356" y="412" class="body">Himalayas + Jobicy</text>
  <text x="356" y="477" class="body">Read-only public APIs</text>
  <text x="356" y="507" class="body">No scraper fallback</text>

  <text x="632" y="312" class="engine-number">03 / Decide locally</text>
  <text x="632" y="367" class="engine-stage">Python pipeline</text>
  <text x="632" y="416" class="engine-body">Normalize and deduplicate</text>
  <text x="632" y="452" class="engine-body">Check cost, location, and level</text>
  <text x="632" y="488" class="engine-body">Score or flag for review</text>
  <path d="M632 518 H978" stroke="#7294e9" stroke-width="2"/>
  <text x="632" y="548" class="engine-body">Explainable rules · no auto-apply</text>

  <text x="1046" y="312" class="number">04 / Organize</text>
  <text x="1046" y="365" class="stage">Review queue</text>
  <text x="1046" y="412" class="body">Google Sheets</text>
  <text x="1046" y="477" class="body">Desktop OAuth</text>
  <text x="1046" y="507" class="body">Human-owned fields</text>

  <text x="1334" y="312" class="number">05 / Human</text>
  <text x="1334" y="365" class="stage">Your call</text>
  <text x="1334" y="412" class="body">Review the fit</text>
  <text x="1334" y="442" class="body">Open the link</text>
  <text x="1334" y="507" class="body">Apply manually</text>

  <!-- Side paths are deliberately separate from the default workflow. -->
  <path d="M806 578 V618" fill="none" stroke="#b17f26" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="594" y="618" width="424" height="118" rx="12" fill="#fff9ed" stroke="#dcc697" stroke-width="2"/>
  <text x="622" y="661" class="note-title">Optional AI is off</text>
  <text x="622" y="698" class="note">Gemini or Ollama needs separate approval.</text>

  <path d="M1155 578 V618" fill="none" stroke="#8295a9" stroke-width="2"/>
  <rect x="1040" y="618" width="480" height="118" rx="12" fill="#f0f4f8" stroke="#cbd7e4" stroke-width="2"/>
  <text x="1068" y="661" class="note-title">Local recovery</text>
  <text x="1068" y="698" class="note">Lease · snapshot · pending-run replay</text>

  <rect x="80" y="784" width="1440" height="82" rx="12" fill="#e8f5f1" stroke="#a8d2c7" stroke-width="2"/>
  <rect x="80" y="784" width="10" height="82" rx="5" fill="#16836f"/>
  <text x="116" y="825" class="safety">The system prepares decisions. You submit applications and messages.</text>
  <text x="116" y="851" class="safety-note">No authenticated job-platform action or outbound message is automated.</text>
</svg>
